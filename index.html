    <script>
        const container = document.getElementById("esp-container");
        const skeletonSvg = document.getElementById("skeleton-svg");

        const espItems = new Map();
        const skeletonItems = new Map();

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function makeEspElement(id) {
            const div = document.createElement("div");
            div.className = "external-esp";
            div.dataset.id = id;

            div.innerHTML = `
                <div class="esp-card">
                    <div class="esp-name"></div>
                    <div class="esp-meta"></div>
                    <div class="hp-wrap">
                        <div class="hp-fill"></div>
                    </div>
                </div>
            `;

            container.appendChild(div);

            return {
                el: div,
                nameEl: div.querySelector(".esp-name"),
                metaEl: div.querySelector(".esp-meta"),
                hpEl: div.querySelector(".hp-fill"),
                x: 0,
                y: 0,
                tx: 0,
                ty: 0,
                hp: 100,
                thp: 100,
                scale: 1,
                tscale: 1,
                lastSeen: performance.now()
            };
        }

        function makeSkeletonLine(id) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

            const glow = document.createElementNS("http://www.w3.org/2000/svg", "line");
            glow.setAttribute("class", "skeleton-glow");

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("class", "skeleton-line");

            group.appendChild(glow);
            group.appendChild(line);
            skeletonSvg.appendChild(group);

            return {
                group,
                glow,
                line,
                x1: 0,
                y1: 0,
                x2: 0,
                y2: 0,
                tx1: 0,
                ty1: 0,
                tx2: 0,
                ty2: 0,
                lastSeen: performance.now()
            };
        }

        window.addEventListener("message", (event) => {
            const data = event.data;
            const now = performance.now();

            if (data.action === "updateExternalESP") {
                const seen = new Set();

                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach((p, index) => {
                        const id = String(p.id ?? index);
                        seen.add(id);

                        let item = espItems.get(id);
                        if (!item) {
                            item = makeEspElement(id);
                            espItems.set(id, item);
                            item.x = Number(p.x || 0);
                            item.y = Number(p.y || 0);
                        }

                        const hp = clamp(Number(p.health ?? 0), 0, Number(p.maxHealth ?? 100));
                        const maxHp = Math.max(1, Number(p.maxHealth ?? 100));
                        const hpPercent = clamp(hp / maxHp, 0, 1);

                        item.tx = Number(p.x || 0);
                        item.ty = Number(p.y || 0);
                        item.thp = hpPercent;
                        item.tscale = clamp(Number(p.scale ?? 1), 0.55, 1.05);
                        item.lastSeen = now;

                        item.nameEl.innerHTML = `${p.name || "Unknown"} <span>[${p.id ?? "-"}]</span>`;
                        item.metaEl.textContent = `${p.dist ?? 0}m`;
                    });
                }

                for (const [id, item] of espItems) {
                    if (!seen.has(id)) {
                        item.lastSeen = 0;
                    }
                }
            }

            if (data.action === "updateSkeletonESP") {
                const seen = new Set();
                let lineIndex = 0;

                if (data.skeletons && Array.isArray(data.skeletons)) {
                    data.skeletons.forEach((player, playerIndex) => {
                        if (!player.lines) return;

                        player.lines.forEach((ln) => {
                            const id = `${player.playerId ?? playerIndex}_${lineIndex++}`;
                            seen.add(id);

                            let item = skeletonItems.get(id);
                            if (!item) {
                                item = makeSkeletonLine(id);
                                skeletonItems.set(id, item);
                                item.x1 = Number(ln.x1 || 0);
                                item.y1 = Number(ln.y1 || 0);
                                item.x2 = Number(ln.x2 || 0);
                                item.y2 = Number(ln.y2 || 0);
                            }

                            item.tx1 = Number(ln.x1 || 0);
                            item.ty1 = Number(ln.y1 || 0);
                            item.tx2 = Number(ln.x2 || 0);
                            item.ty2 = Number(ln.y2 || 0);
                            item.lastSeen = now;
                        });
                    });
                }

                for (const [id, item] of skeletonItems) {
                    if (!seen.has(id)) {
                        item.lastSeen = 0;
                    }
                }
            }

            if (data.action === "updateTextESP") {
                document.querySelectorAll(".player-text").forEach(x => x.remove());

                if (!data.textData) return;

                data.textData.forEach(player => {
                    let text = "";

                    if (player.showPlayerName) text += player.playerName;
                    if (player.showPlayerID) text += ` [${player.playerServerId}]`;

                    if (text === "") return;

                    const div = document.createElement("div");
                    div.className = "player-text";
                    div.style.transform = `translate(${player.textPosition.x}px, ${player.textPosition.y}px)`;
                    div.innerText = text;
                    container.appendChild(div);
                });
            }
        });

        function animate() {
            const now = performance.now();
            const smooth = 0.38;

            for (const [id, item] of espItems) {
                if (item.lastSeen === 0 || now - item.lastSeen > 350) {
                    item.el.remove();
                    espItems.delete(id);
                    continue;
                }

                item.x = lerp(item.x, item.tx, smooth);
                item.y = lerp(item.y, item.ty, smooth);
                item.hp = lerp(item.hp, item.thp, 0.22);
                item.scale = lerp(item.scale, item.tscale, 0.22);

                item.el.style.transform = `translate(${item.x}vw, ${item.y}vh) translate(-50%, -118%) scale(${item.scale})`;
                item.hpEl.style.transform = `scaleX(${item.hp})`;
            }

            for (const [id, item] of skeletonItems) {
                if (item.lastSeen === 0 || now - item.lastSeen > 350) {
                    item.group.remove();
                    skeletonItems.delete(id);
                    continue;
                }

                item.x1 = lerp(item.x1, item.tx1, smooth);
                item.y1 = lerp(item.y1, item.ty1, smooth);
                item.x2 = lerp(item.x2, item.tx2, smooth);
                item.y2 = lerp(item.y2, item.ty2, smooth);

                for (const line of [item.glow, item.line]) {
                    line.setAttribute("x1", item.x1);
                    line.setAttribute("y1", item.y1);
                    line.setAttribute("x2", item.x2);
                    line.setAttribute("y2", item.y2);
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
